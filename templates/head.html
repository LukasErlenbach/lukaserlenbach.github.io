<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>$title$ | $site_name$</title>
    <meta name="description" content="$description$">
    <link rel="canonical" href="$site_url$$canonical_path$">
    $if(alternate_lang)$
    <link rel="alternate" hreflang="$lang$" href="$site_url$$canonical_path$">
    <link rel="alternate" hreflang="$alternate_lang$" href="$site_url$$alternate_path$">
    $endif$
    <meta name="google-site-verification" content="wEjUQsgPLHLH2f8ey9_OG62PzRpH55Tku4Q6Pmle3ak">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="$site_name$">
    <meta property="og:title" content="$title$ | $site_name$">
    <meta property="og:description" content="$description$">
    <meta property="og:url" content="$site_url$$canonical_path$">
    <meta property="og:image" content="$site_url$/static/img/og-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="$if(lang)$$lang$$else$en$endif$">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="/static/img/favicon.png" type="image/png" sizes="64x64">

    <!-- Apply the stored theme before first paint so dark-mode users get no white flash. -->
    <script>
    (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored === "dark" || (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark-mode");
    })();
    </script>

    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    <link rel="stylesheet" href="/static/css/general.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="stylesheet" href="/static/css/syntax.css">

    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Lukas Erlenbach",
    "jobTitle": ["Management Consultant", "Lead AI Consultant", "Gestalttherapeut i.A."],
    "url": "$site_url$",
    "image": "$site_url$/static/img/og-card.jpg",
    "address": { "@type": "PostalAddress", "addressLocality": "Berlin", "addressCountry": "DE" },
    "knowsAbout": ["Gestalttherapie", "Data Science", "Burnout-Prävention", "High Performance Coaching", "AI"],
    "description": "Lukas Erlenbach verbindet Data Science mit Gestalttherapie. Beratung und Coaching für High Performer und Consultants.",
    "sameAs": [
        "https://www.linkedin.com/in/$linkedin_username$",
        "https://github.com/$github_username$"
    ]
    }
    </script>
</head>
